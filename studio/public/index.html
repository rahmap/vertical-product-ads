<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Affiliate</title>
<link rel="stylesheet" href="/app.css">
</head>
<body class="min-h-screen">
<div class="lg:grid lg:grid-cols-[232px_minmax(0,1fr)]">

  <!-- sidebar (desktop) / top bar (mobile) -->
  <aside class="sticky top-0 z-20 border-b border-line bg-canvas/90 backdrop-blur lg:h-screen lg:border-r lg:border-b-0 lg:bg-canvas">
    <div class="flex items-center gap-2 px-3 py-2.5 sm:gap-3 sm:px-4 lg:h-full lg:flex-col lg:items-stretch lg:gap-0 lg:px-3 lg:py-5">
      <a href="#/" class="flex items-center gap-2 px-1 font-bold tracking-tight no-underline lg:mb-6 lg:px-3">
        <span class="grid size-7 place-items-center rounded-lg bg-brand text-brand-ink" aria-hidden="true">
          <svg viewBox="0 0 24 24" class="size-4" fill="currentColor"><path d="M8 5.1v13.8a1 1 0 0 0 1.5.86l11.3-6.9a1 1 0 0 0 0-1.72L9.5 4.24A1 1 0 0 0 8 5.1Z"/></svg>
        </span>
        <span class="hidden sm:inline">Studio Affiliate</span>
      </a>
      <nav class="flex flex-1 gap-1 lg:flex-none lg:flex-col" aria-label="Utama">
        <a class="nav" href="#/" data-nav="home">
          <svg viewBox="0 0 24 24" class="size-[18px]" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
          <span>Beranda</span>
          <span id="nav-todo" class="badge ml-auto hidden bg-brand text-brand-ink"></span>
        </a>
        <a class="nav" href="#/produk" data-nav="produk">
          <svg viewBox="0 0 24 24" class="size-[18px]" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 8-9-5-9 5 9 5 9-5Z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>
          <span>Produk</span>
        </a>
      </nav>
      <a class="btn btn-primary lg:mt-4" href="#/produk/baru" aria-label="Produk baru">
        <svg viewBox="0 0 24 24" class="size-4" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span class="hidden sm:inline">Produk baru</span>
      </a>

      <!-- queue hint: shown when jobs wait for Claude Code -->
      <div id="queue-box" class="mt-auto hidden rounded-xl border border-line bg-surface p-3 text-[13px] lg:block">
        <div class="mb-1 font-semibold" id="queue-title">Antrean kosong</div>
        <p class="mb-2 text-muted" id="queue-text">Tidak ada yang menunggu dikerjakan.</p>
        <button id="queue-copy" class="btn btn-sm w-full font-mono" type="button">/affiliate-queue</button>
      </div>
    </div>
  </aside>

  <main id="app" class="mx-auto w-full max-w-6xl px-4 pt-6 pb-24 sm:px-6 lg:px-10 lg:pt-9"></main>
</div>

<div id="toast" role="status" aria-live="polite" class="pointer-events-none fixed bottom-6 left-1/2 z-50 max-w-[90vw] -translate-x-1/2 translate-y-2 rounded-xl px-4 py-2.5 text-sm font-medium opacity-0 shadow-lg transition duration-200"></div>
<dialog id="confirm" class="m-auto w-[min(26rem,92vw)] rounded-2xl border border-line bg-surface p-0 text-ink shadow-2xl">
  <form method="dialog" class="p-5">
    <h2 id="confirm-title" class="mb-1 text-base font-semibold"></h2>
    <p id="confirm-text" class="mb-5 text-sm text-muted"></p>
    <div class="flex justify-end gap-2">
      <button class="btn" value="no" autofocus>Batal</button>
      <button id="confirm-yes" class="btn" value="yes"></button>
    </div>
  </form>
</dialog>
<script type="module" src="/app.js"></script>
</body>
</html>
