<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>vertical-product-ads</title>
<style>
  /* Theme variables. scenes.json "theme.css" (and the look) override any of them on #frame. The look variables
     (--display-weight, --head-case, --ui-round, --caption-font…) have no default here: each use falls back to
     the built-in value, so a film without them renders as before. */
  :root {
    --base: #EDE7E3; --bg: linear-gradient(180deg, #F4EFEC 0%, #E9E1DC 100%);
    --band: radial-gradient(130% 70% at 50% 38%, #FFFFFF 0%, #F6F1EE 62%, #ECE4DF 100%);
    --ink: #1F1A1C; --accent: #9C2F4F; --accent-pressed: #7A2240; --muted: rgba(31, 26, 28, 0.78);
    --surface: rgba(255, 255, 255, 0.92); --surface-label: rgba(255, 255, 255, 0.88); --icon-bg: #F1E6E9;
    --shadow-rgb: 60, 40, 48; --cta-shadow-rgb: 90, 30, 50; --dot-shadow-rgb: 60, 20, 40;
    --serif: Georgia, "Times New Roman", serif; --sans: system-ui, "Helvetica Neue", sans-serif;
    --sheen: linear-gradient(104deg, rgba(255,255,255,0) 38%, rgba(255,255,255,0.42) 50%, rgba(255,255,255,0) 62%);
    --grain-opacity: 0.05;
    --caption-ink: #FFFFFF; --caption-bg: rgba(0, 0, 0, 0.55); --caption-active: #FFD84D;
    /* three tones of the palette, soft → strong, for fill layers (cards, bands); each look sets its own */
    --tone-1: #F3D6DE; --tone-2: #D98AA3; --tone-3: #9C2F4F;
  }
  html, body { margin: 0; padding: 0; background: #000; }
  #frame { position: relative; overflow: hidden; background: var(--base); }
  #bg, #world, #hud, #grain, #safe { position: absolute; inset: 0; }
  #bg { overflow: hidden; background: var(--bg); }
  .pool { position: absolute; border-radius: 50%; }
  #world { transform-origin: 0 0; }
  .shadow, .band { position: absolute; left: 0; top: 0; }
  .shadow { box-shadow: 0 46px 90px rgba(var(--shadow-rgb), 0.20), 0 10px 24px rgba(var(--shadow-rgb), 0.10); }
  #bands { position: absolute; left: 0; top: 0; }
  .band { overflow: hidden; isolation: isolate; background: var(--band); }
  .band > * { position: absolute; left: 0; top: 0; transform-origin: 50% 50%; }
  .band img { display: block; }
  .backdrop { filter: blur(46px) brightness(var(--backdrop-dim, 0.62)) saturate(1.1); }
  .sheen { background: var(--sheen); }
  #overlay { position: absolute; inset: 0; overflow: visible; }
  #hud { pointer-events: none; }
  .tb { position: absolute; color: var(--ink); text-shadow: var(--text-shadow, none); }
  .tb .w { display: inline-block; white-space: pre; }
  .tb .wi { display: inline-block; white-space: pre; }
  .tb .line { display: block; }
  .acc { color: var(--accent); text-shadow: var(--acc-glow, var(--text-shadow, none)); }
  .serif { font-family: var(--serif); font-weight: var(--display-weight, 400); }
  .ital { font-style: italic; }
  .sans { font-family: var(--sans); font-weight: var(--text-weight, normal); }
  .h0 { font-size: 112px; line-height: calc(1.0 * var(--head-leading, 1)); letter-spacing: calc(-0.015em + var(--head-tracking, 0em)); text-transform: var(--head-case, none); }
  .h1 { font-size: 88px; line-height: calc(1.04 * var(--head-leading, 1)); letter-spacing: calc(-0.01em + var(--head-tracking, 0em)); text-transform: var(--head-case, none); }
  .wordmark { font-size: 172px; line-height: calc(1 * var(--head-leading, 1)); letter-spacing: calc(0.005em + var(--head-tracking, 0em)); text-transform: var(--head-case, none); }
  .sub { font-size: 64px; line-height: calc(1.05 * var(--head-leading, 1)); letter-spacing: calc(0.01em + var(--head-tracking, 0em)); text-transform: var(--head-case, none); }
  .caps { font-size: 36px; letter-spacing: var(--caps-tracking, 0.2em); text-transform: uppercase; font-weight: var(--caps-weight, 600); }
  .foot { font-size: 23px; letter-spacing: 0.01em; font-weight: 500; color: var(--muted); }
  /* captions: left 50% + width max-content keeps the box tight around the text; max-width (the safe width) is set in JS */
  .cap { position: absolute; left: 50%; width: max-content; box-sizing: border-box; text-align: center; transform-origin: 50% 50%;
         font-family: var(--caption-font, var(--sans)); font-weight: var(--caption-weight, 800); line-height: 1.12; color: var(--caption-ink); }
  .cap .cw { display: inline-block; white-space: pre; transform-origin: 50% 80%; }
  .cap.pill { padding: 0.18em 0.45em 0.22em; border-radius: var(--caption-radius, 0.42em); background: var(--caption-bg); }
  .cap.plain { -webkit-text-stroke: 0.09em var(--caption-stroke, rgba(0, 0, 0, 0.85)); paint-order: stroke fill; text-shadow: 0 0.05em 0.14em rgba(0, 0, 0, 0.55); }
  /* chips, labels and the CTA share the UI variables: --ui-font, --ui-ink, --ui-weight, --ui-case, --ui-tracking,
     --ui-border, --ui-round (corner radius × 0–1) */
  .chip { position: absolute; display: flex; align-items: center; gap: 18px; height: 104px; padding: 0 38px 0 20px; box-sizing: border-box;
          border-radius: calc(52px * var(--ui-round, 1)); background: var(--surface); color: var(--ui-ink, var(--ink)); white-space: nowrap;
          border: var(--ui-border, none); box-shadow: var(--chip-shadow, 0 18px 40px rgba(var(--shadow-rgb), 0.16)); font-size: 44px;
          font-family: var(--ui-font, var(--sans)); font-weight: var(--ui-weight, 600); text-transform: var(--ui-case, none); letter-spacing: var(--ui-tracking, normal); }
  .chip .ic { width: 66px; height: 66px; border-radius: calc(33px * var(--ui-round, 1)); background: var(--icon-bg); display: grid; place-items: center; }
  .label { position: absolute; height: 58px; padding: 0 26px; border-radius: calc(29px * var(--ui-round, 1)); display: flex; align-items: center; box-sizing: border-box;
           background: var(--surface-label); color: var(--ui-ink, var(--ink)); border: var(--ui-border, none); font-size: 28px;
           font-family: var(--ui-font, var(--sans)); font-weight: var(--ui-weight, 600); text-transform: var(--ui-case, none); letter-spacing: var(--ui-tracking, 0.04em); }
  /* price sticker. Look variables: --price-bg, --price-ink, --price-badge-bg (each falls back to the UI surface, ink and accent) */
  .price { position: absolute; display: flex; flex-direction: column; align-items: center; box-sizing: border-box; white-space: nowrap;
           padding: 0.26em 0.5em 0.3em; font-size: 104px; line-height: 1; transform-origin: 50% 50%; letter-spacing: -0.01em;
           background: var(--price-bg, var(--surface)); color: var(--price-ink, var(--ui-ink, var(--ink))); border: var(--ui-border, none);
           border-radius: calc(0.3em * var(--ui-round, 1)); box-shadow: var(--chip-shadow, 0 18px 40px rgba(var(--shadow-rgb), 0.16));
           font-family: var(--ui-font, var(--sans)); font-weight: 800; font-variant-numeric: lining-nums tabular-nums; }
  .price .pr-was { font-size: 0.4em; font-weight: 600; opacity: 0.62; text-decoration: line-through; text-decoration-thickness: 0.09em; margin-bottom: 0.2em; }
  .price .pr-badge { position: absolute; right: -0.3em; top: -0.34em; font-size: 0.36em; padding: 0.32em 0.6em; border-radius: 999px; letter-spacing: 0;
                     background: var(--price-badge-bg, var(--accent)); color: var(--cta-ink, #fff); transform: rotate(8deg); }
  .odo { position: absolute; display: flex; align-items: baseline; justify-content: center; color: var(--accent);
         font-variant-numeric: lining-nums tabular-nums; text-shadow: var(--acc-glow, none); }
  .slot { position: relative; overflow: visible; clip-path: inset(0 -80px); }
  .strip { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; }
  .strip span { display: block; text-align: center; }
  #cta { position: absolute; display: flex; align-items: center; justify-content: center; background: var(--accent); color: var(--cta-ink, #fff);
         overflow: hidden; font-size: 40px; font-family: var(--ui-font, var(--sans)); font-weight: var(--ui-weight, 600); letter-spacing: var(--ui-tracking, 0.02em);
         text-transform: var(--ui-case, none); white-space: nowrap; box-sizing: border-box; border: var(--ui-border, none);
         box-shadow: var(--cta-shadow, 0 22px 44px rgba(var(--cta-shadow-rgb), 0.30)); }
  .wiper { position: absolute; width: 14px; border-radius: 7px; background: #fff; box-shadow: 0 6px 22px rgba(var(--shadow-rgb), 0.35); }
  #dot { position: absolute; width: 72px; height: 72px; margin: -36px 0 0 -36px; border-radius: 50%;
         background: rgba(255, 255, 255, 0.92); border: 3px solid rgba(var(--accent-rgb), 0.55);
         box-sizing: border-box; box-shadow: 0 10px 26px rgba(var(--dot-shadow-rgb), 0.28); }
  #ripple { position: absolute; width: 72px; height: 72px; margin: -36px 0 0 -36px; border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.95); box-sizing: border-box; }
  #grain { pointer-events: none; opacity: var(--grain-opacity); }
  #safe { pointer-events: none; display: none; }
  #safe.on { display: block; }
  #safe div { position: absolute; border: 2px dashed rgba(0, 160, 255, 0.9); }
  /* layout pieces. Look variables: --panel-round (corner × 0–1), --panel-shadow, --panel-border, --panel-paper (polaroid),
     --device-ink (phone bezel), --callout-line, --callout-width, --callout-dot, --marquee-bg, --marquee-ink, --marquee-font,
     --marquee-weight, --check-yes, --check-no, --mask-shadow, --mask-stroke */
  #panels { position: absolute; left: 0; top: 0; }
  .pnl { position: absolute; transform-origin: 50% 50%;
         box-shadow: var(--panel-shadow, 0 34px 80px rgba(var(--shadow-rgb), 0.22), 0 10px 24px rgba(var(--shadow-rgb), 0.12)); }
  .pnl.flat { box-shadow: none; }
  .pnl.polaroid { background: var(--panel-paper, #FFFFFF); }
  .pnl.phone { background: var(--device-ink, #0E0E10); }
  .pin { position: absolute; overflow: hidden; isolation: isolate; background: var(--band); }
  .pin > * { position: absolute; left: 0; top: 0; transform-origin: 50% 50%; }
  .pin img { display: block; }
  .pin::after { content: ''; position: absolute; inset: 0; z-index: 5; border-radius: inherit; border: var(--panel-border, none); pointer-events: none; }
  .pnl.phone .pin::after { border: none; }
  .pnl .island { position: absolute; border-radius: 999px; background: #000; }
  .mask { position: absolute; white-space: pre; line-height: 0.92; filter: var(--mask-shadow, none); }
  .mask .mki { display: inline-block; color: transparent; -webkit-background-clip: text; background-clip: text; background-repeat: no-repeat;
               -webkit-text-stroke: var(--mask-stroke, 0px transparent); text-transform: var(--head-case, none);
               letter-spacing: calc(-0.02em + var(--head-tracking, 0em)); }
  #calls { position: absolute; left: 0; top: 0; overflow: visible; }
  .cl-line { stroke: var(--callout-line, var(--accent)); stroke-width: var(--callout-width, 4px); stroke-linecap: round; fill: none; }
  .cl-dot { fill: var(--callout-dot, var(--accent)); stroke: #FFFFFF; stroke-width: 5; }
  .callout { position: absolute; height: 72px; padding: 0 30px; display: flex; align-items: center; box-sizing: border-box; white-space: nowrap;
             background: var(--surface); color: var(--ui-ink, var(--ink)); border: var(--ui-border, none); border-radius: calc(36px * var(--ui-round, 1));
             box-shadow: var(--chip-shadow, 0 18px 40px rgba(var(--shadow-rgb), 0.16)); font-size: 34px; font-family: var(--ui-font, var(--sans));
             font-weight: var(--ui-weight, 600); text-transform: var(--ui-case, none); letter-spacing: var(--ui-tracking, normal); }
  .marq { position: absolute; overflow: hidden; display: flex; align-items: center; transform-origin: 50% 50%;
          background: var(--marquee-bg, var(--accent)); color: var(--marquee-ink, var(--cta-ink, #FFFFFF)); }
  .mtrack { display: flex; white-space: nowrap; font-family: var(--marquee-font, var(--ui-font, var(--sans))); font-weight: var(--marquee-weight, 800);
            text-transform: uppercase; letter-spacing: 0.04em; line-height: 1; }
  .mtrack span { padding: 0 0.45em; }
  .ck-row, .ck-head { position: absolute; display: flex; align-items: center; box-sizing: border-box; font-family: var(--ui-font, var(--sans)); }
  .ck-row { background: var(--surface); color: var(--ui-ink, var(--ink)); border: var(--ui-border, none);
            box-shadow: var(--chip-shadow, 0 18px 40px rgba(var(--shadow-rgb), 0.16)); font-weight: var(--ui-weight, 600);
            text-transform: var(--ui-case, none); letter-spacing: var(--ui-tracking, normal); }
  .ck-head { color: var(--ink); font-weight: var(--caps-weight, 600); letter-spacing: var(--caps-tracking, 0.2em); text-transform: uppercase;
             text-shadow: var(--text-shadow, none); }
  .ck-t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; }
  .ck-m { flex: none; display: grid; place-items: center; text-align: center; white-space: nowrap; }
  .ck-yes, .ck-no { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .ck-yes { stroke: var(--check-yes, var(--accent)); }
  .ck-no { stroke: var(--check-no, var(--muted)); }
</style>
</head>
<body>
<div id="frame">
  <div id="bg"></div>
  <div id="world">
    <div id="shadows"></div>
    <div id="bands"></div>
    <div id="panels"></div>
    <svg id="overlay"></svg>
  </div>
  <div id="hud"></div>
  <canvas id="grain"></canvas>
  <div id="safe"><div></div></div>
</div>
<script src="engine.js"></script>
</body>
</html>
