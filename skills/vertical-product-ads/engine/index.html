<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>vertical-product-ads</title>
<style>
  /* Theme variables. scenes.json "theme.css" overrides any of them on #frame. */
  :root {
    --base: #EDE7E3; --bg: linear-gradient(180deg, #F4EFEC 0%, #E9E1DC 100%);
    --band: radial-gradient(130% 70% at 50% 38%, #FFFFFF 0%, #F6F1EE 62%, #ECE4DF 100%);
    --ink: #1F1A1C; --accent: #9C2F4F; --accent-pressed: #7A2240; --muted: rgba(31, 26, 28, 0.78);
    --surface: rgba(255, 255, 255, 0.92); --surface-label: rgba(255, 255, 255, 0.88); --icon-bg: #F1E6E9;
    --shadow-rgb: 60, 40, 48; --cta-shadow-rgb: 90, 30, 50; --dot-shadow-rgb: 60, 20, 40;
    --serif: Georgia, "Times New Roman", serif; --sans: system-ui, "Helvetica Neue", sans-serif;
    --sheen: linear-gradient(104deg, rgba(255,255,255,0) 38%, rgba(255,255,255,0.42) 50%, rgba(255,255,255,0) 62%);
    --grain-opacity: 0.05;
    --caption-ink: #FFFFFF; --caption-bg: rgba(0, 0, 0, 0.55); --caption-active: #FFD84D;
  }
  html, body { margin: 0; padding: 0; background: #000; }
  #frame { position: relative; overflow: hidden; background: var(--base); }
  #bg, #world, #hud, #grain, #safe { position: absolute; inset: 0; }
  #bg { overflow: hidden; background: var(--bg); }
  .pool { position: absolute; border-radius: 50%; }
  #world { transform-origin: 0 0; }
  .shadow, .band { position: absolute; left: 0; top: 0; }
  .shadow { box-shadow: 0 46px 90px rgba(var(--shadow-rgb), 0.20), 0 10px 24px rgba(var(--shadow-rgb), 0.10); }
  #bands { position: absolute; left: 0; top: 0; }
  .band { overflow: hidden; isolation: isolate; background: var(--band); }
  .band > * { position: absolute; left: 0; top: 0; transform-origin: 50% 50%; }
  .band img { display: block; }
  .sheen { background: var(--sheen); }
  #overlay { position: absolute; inset: 0; overflow: visible; }
  #hud { pointer-events: none; }
  .tb { position: absolute; color: var(--ink); }
  .tb .w { display: inline-block; white-space: pre; }
  .tb .line { display: block; }
  .acc { color: var(--accent); }
  .serif { font-family: var(--serif); font-weight: 400; }
  .ital { font-style: italic; }
  .sans { font-family: var(--sans); }
  .h0 { font-size: 112px; line-height: 1.0; letter-spacing: -0.015em; }
  .h1 { font-size: 88px; line-height: 1.04; letter-spacing: -0.01em; }
  .wordmark { font-size: 172px; line-height: 1; letter-spacing: 0.005em; }
  .sub { font-size: 64px; line-height: 1.05; letter-spacing: 0.01em; }
  .caps { font-size: 36px; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 600; }
  .foot { font-size: 23px; letter-spacing: 0.01em; font-weight: 500; color: var(--muted); }
  /* captions: left 50% + width max-content keeps the box tight around the text; max-width (the safe width) is set in JS */
  .cap { position: absolute; left: 50%; width: max-content; box-sizing: border-box; text-align: center; transform-origin: 50% 50%;
         font-family: var(--sans); font-weight: 800; line-height: 1.12; color: var(--caption-ink); }
  .cap .cw { display: inline-block; white-space: pre; }
  .cap.pill { padding: 0.18em 0.45em 0.22em; border-radius: 0.42em; background: var(--caption-bg); }
  .cap.plain { -webkit-text-stroke: 0.09em rgba(0, 0, 0, 0.85); paint-order: stroke fill; text-shadow: 0 0.05em 0.14em rgba(0, 0, 0, 0.55); }
  .chip { position: absolute; display: flex; align-items: center; gap: 18px; height: 104px; padding: 0 38px 0 20px;
          border-radius: 52px; background: var(--surface); color: var(--ink); white-space: nowrap;
          box-shadow: 0 18px 40px rgba(var(--shadow-rgb), 0.16); font-size: 44px; font-weight: 600; }
  .chip .ic { width: 66px; height: 66px; border-radius: 33px; background: var(--icon-bg); display: grid; place-items: center; }
  .label { position: absolute; height: 58px; padding: 0 26px; border-radius: 29px; display: flex; align-items: center;
           background: var(--surface-label); color: var(--ink); font-size: 28px; font-weight: 600; letter-spacing: 0.04em; }
  .odo { position: absolute; display: flex; align-items: baseline; justify-content: center; color: var(--accent); }
  .slot { position: relative; overflow: visible; clip-path: inset(0 -80px); }
  .strip { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; }
  .strip span { display: block; text-align: center; }
  #cta { position: absolute; display: flex; align-items: center; justify-content: center; background: var(--accent); color: #fff;
         overflow: hidden; font-size: 40px; font-weight: 600; letter-spacing: 0.02em; white-space: nowrap;
         box-shadow: 0 22px 44px rgba(var(--cta-shadow-rgb), 0.30); }
  .wiper { position: absolute; width: 14px; border-radius: 7px; background: #fff; box-shadow: 0 6px 22px rgba(var(--shadow-rgb), 0.35); }
  #dot { position: absolute; width: 72px; height: 72px; margin: -36px 0 0 -36px; border-radius: 50%;
         background: rgba(255, 255, 255, 0.92); border: 3px solid rgba(var(--accent-rgb), 0.55);
         box-sizing: border-box; box-shadow: 0 10px 26px rgba(var(--dot-shadow-rgb), 0.28); }
  #ripple { position: absolute; width: 72px; height: 72px; margin: -36px 0 0 -36px; border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.95); box-sizing: border-box; }
  #grain { pointer-events: none; opacity: var(--grain-opacity); }
  #safe { pointer-events: none; display: none; }
  #safe.on { display: block; }
  #safe div { position: absolute; border: 2px dashed rgba(0, 160, 255, 0.9); }
</style>
</head>
<body>
<div id="frame">
  <div id="bg"></div>
  <div id="world">
    <div id="shadows"></div>
    <div id="bands"></div>
    <svg id="overlay"></svg>
  </div>
  <div id="hud"></div>
  <canvas id="grain"></canvas>
  <div id="safe"><div></div></div>
</div>
<script src="engine.js"></script>
</body>
</html>
